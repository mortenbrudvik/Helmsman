name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the plugin binary check diffs the build inputs (src/, config/, root build
          # files) against the commit the exe was built from.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Publish
        run: |
          dotnet publish src/Helmsman/Helmsman.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            --output ./publish

      # bin/helmsman.exe is the exe the Claude Code plugin runs. A v* tag must ship an
      # exe built from the tagged sources with the tagged version (scripts/Publish-Plugin.ps1).
      # A push or pull request that changes the exe gets the same strict check (without the tag),
      # so a stale or hand-built exe fails when it is committed; users install the plugin from main.
      # Otherwise a stale exe is expected until the next release, so it is only a warning.
      - name: Verify committed plugin binary
        shell: pwsh
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            ./scripts/Test-PluginBinary.ps1 -Tag $env:GITHUB_REF_NAME
          } else {
            . ./scripts/ReleaseCommon.ps1
            if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
              $change = Test-PluginBinaryChanged -Root $PWD.Path -Base $env:PR_BASE_SHA -Head $env:PR_HEAD_SHA -SinceMergeBase
            } else {
              $change = Test-PluginBinaryChanged -Root $PWD.Path -Base $env:PUSH_BEFORE_SHA -Head $env:GITHUB_SHA
            }
            Write-Host $change.Reason
            if ($change.Changed) {
              ./scripts/Test-PluginBinary.ps1
            } else {
              ./scripts/Test-PluginBinary.ps1 -WarnOnly
            }
          }

      # The tools an MCP client gets from an exe must be the ones the sources define: the snapshot
      # tests/Helmsman.Tests/Contract/tools.snapshot.json, which ToolSurfaceSnapshotTests keeps current.
      # A version or SHA check cannot catch an exe whose tools differ from its sources; this compares what it serves.
      # The script starts the exe (without a pause hotkey), lists its tools over stdio and closes it; no tool is called.
      # The exe published above is built from this checkout, so it is always compared.
      - name: Check the tools/list of the published exe
        shell: pwsh
        run: ./scripts/Test-ToolsSnapshot.ps1 -ExePath ./publish/helmsman.exe

      # The committed plugin exe is compared only when it was built from the current build inputs (the checks of
      # Test-PluginBinary.ps1); a stale one is expected until the next release, and the step says it skipped it.
      - name: Check the tools/list of the committed plugin binary
        shell: pwsh
        run: ./scripts/Test-ToolsSnapshot.ps1 -ExePath ./bin/helmsman.exe -OnlyIfCurrent

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: helmsman
          path: publish/

  # The test suite of test.yml, run for the tagged commit, so the release job below waits for it.
  # test.yml runs by itself on pushes and pull requests to main, so this job runs only for a v* tag.
  # Its artifacts (coverage-report, test-results, hang-diagnostics) join this run's helmsman artifact.
  # Not named test: test.yml's own job is, and this job's skipped check on a pull request could then
  # satisfy a required status check named test.
  release-tests:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test.yml

  release:
    # Without a status function in its if, the job runs only when both needed jobs succeeded:
    # failing tests skip it, so no release is created.
    needs: [build, release-tests]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Creating a release needs write access. The repository's default GITHUB_TOKEN is read-only,
    # which is why the release job failed ("Too many retries.") for every tag up to v1.11.0.
    # id-token and attestations are for the attestation step only: it signs the build provenance with a
    # short-lived Sigstore certificate (the OIDC token) and stores the attestation in this repository.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: helmsman
          path: ./release

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path ./release/* -DestinationPath "helmsman-$env:GITHUB_REF_NAME-win-x64.zip"

      # SHA256SUMS.txt holds a "<sha-256>  <name>" line for the zip and for each file in it (helmsman.exe and
      # its .pdb), as sha256sum -c reads them: lower-case hex, two spaces, LF line endings, UTF-8 without a BOM.
      # WriteAllText writes exactly that; Out-File, Set-Content and > would not on every PowerShell version.
      # The lines also go to the log and, through checksums-notes.md, to the top of the release notes.
      - name: Compute checksums
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = Get-Item -LiteralPath "helmsman-$tag-win-x64.zip"
          $release = (Resolve-Path -LiteralPath ./release).Path
          $entries = @([pscustomobject]@{ Name = $zip.Name; Path = $zip.FullName })
          $entries += @(Get-ChildItem -LiteralPath $release -File -Recurse | Sort-Object FullName | ForEach-Object {
              [pscustomobject]@{ Name = [IO.Path]::GetRelativePath($release, $_.FullName).Replace('\', '/'); Path = $_.FullName }
            })
          $lines = @($entries | ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.Path -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            })
          if (@($lines -match '  helmsman\.exe$').Count -ne 1) {
            throw 'The release folder has no helmsman.exe.'
          }
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText((Join-Path $PWD.Path 'SHA256SUMS.txt'), ($lines -join "`n") + "`n", $utf8)
          $lines | ForEach-Object { Write-Host $_ }
          $verify = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$tag/README.md#verify-a-download"
          $notes = @('<!-- checksums:begin -->', '### SHA-256 checksums', '', '```text') + $lines + @(
            '```', '',
            ('The same lines are in `SHA256SUMS.txt`, and the zip and `helmsman.exe` have a build provenance ' +
              'attestation: see [Verify a download](' + $verify + '). The exe is not code-signed.'),
            '<!-- checksums:end -->', '', '')
          [IO.File]::WriteAllText((Join-Path $PWD.Path 'checksums-notes.md'), $notes -join "`n", $utf8)

      # Build provenance for the zip and the exe in it: a statement signed through Sigstore that this workflow
      # built them from this commit, which gh attestation verify checks (see README, "Verify a download").
      # GitHub's own action, on a tag like the other actions/* steps. It runs before the release is created,
      # so a failed attestation leaves no release behind.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            helmsman-${{ github.ref_name }}-win-x64.zip
            release/helmsman.exe

      # The GitHub CLI preinstalled on the runner creates the release, so no third-party action runs
      # with this job's write token. --verify-tag refuses to create a missing tag. The zip and
      # SHA256SUMS.txt go up in the one gh release create call, so the release never exists without its
      # checksums. --notes-file text is put before the generated notes (gh release create --help; the
      # REST API puts a body given with generate_release_notes before the generated one).
      # A re-run of the job replaces the zip and SHA256SUMS.txt of the release the first run created,
      # and the checksum block at the top of its notes: a zip made again differs (its entries' times).
      - name: Create Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 'gh release view' fails when the release does not exist yet, the usual case.
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $zip = "helmsman-$tag-win-x64.zip"
          $sums = 'SHA256SUMS.txt'
          $notes = 'checksums-notes.md'
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sums --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload exited with code $LASTEXITCODE." }
            # gh writes UTF-8: decode it as such, so text in the notes outside ASCII survives the edit.
            [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
            $body = (gh release view $tag --json body --jq .body) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "gh release view exited with code $LASTEXITCODE." }
            $body = [regex]::Replace($body, '(?s)<!-- checksums:begin -->.*?<!-- checksums:end -->\s*', '')
            $edited = Join-Path $PWD.Path 'release-notes.md'
            $text = [IO.File]::ReadAllText((Join-Path $PWD.Path $notes)) + $body
            [IO.File]::WriteAllText($edited, $text, [Text.UTF8Encoding]::new($false))
            gh release edit $tag --notes-file $edited
          } else {
            gh release create $tag $zip $sums --title $tag --generate-notes --notes-file $notes --verify-tag
          }
